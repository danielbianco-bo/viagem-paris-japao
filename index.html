<title>Paris → Japão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&text=%E6%9D%B1%E4%BA%AC%E5%AF%8C%E5%A3%AB%E5%B1%B1%E4%BA%AC%E9%83%BD%E5%A4%A7%E9%98%AA%E3%83%91%E3%83%AA%E6%97%A5%E6%9C%AC&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
/* Layout: noite azul de cinema. Aba "Rota" abre com o mapa (mundo + Japão) e as cidades clicáveis; cada dia é uma capa com a foto-chave e uma linha do tempo de locais; Equipamentos e Vídeos no fim. */
:root{
  --bg:#0b1020; --surface:#121a2e; --surface-2:#19233d; --fg:#edf0f7; --muted:#9aa4bd; --line:#263253;
  --accent:#e5482f; --accent-fg:#ffffff; --blue:#7f9df0; --ok:#45c483; --ok-fg:#04210f; --gold:#e9b45a; --note:#2a2216; --note-fg:#f0cd96;
  --land:#1c2846; --sea:#0b1020; --grid:#18213a;
  --display:"Syne","Helvetica Neue",Arial,sans-serif; --body:"DM Sans","Helvetica Neue",Arial,sans-serif; --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f7;--surface:#ffffff;--surface-2:#f4f6fb;--fg:#121726;--muted:#5a6378;--line:#d6dbe7;--accent:#c93a22;--accent-fg:#ffffff;--blue:#2c4fa8;--ok:#1d8a4e;--ok-fg:#ffffff;--gold:#a8700f;--note:#fff3e2;--note-fg:#6b3a10;--land:#d5dcea;--sea:#eef1f7;--grid:#e1e6f0;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f7;--surface:#ffffff;--surface-2:#f4f6fb;--fg:#121726;--muted:#5a6378;--line:#d6dbe7;--accent:#c93a22;--accent-fg:#ffffff;--blue:#2c4fa8;--ok:#1d8a4e;--ok-fg:#ffffff;--gold:#a8700f;--note:#fff3e2;--note-fg:#6b3a10;--land:#d5dcea;--sea:#eef1f7;--grid:#e1e6f0;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 80px}
.wrap{max-width:1080px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.jp{font-family:var(--jp);font-weight:600}

/* topo fixo */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar-in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center}
.brand{font:800 15px var(--display);letter-spacing:-.01em;white-space:nowrap;display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.85}
.tab.today::after{content:"hoje";font:700 9px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:1px}
.tab[aria-pressed="true"].today::after{color:var(--accent-fg)}
.tab.sep{margin-left:8px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.warn{color:var(--accent)}
@media (min-width:860px){.brand{display:block}}

/* hero da rota */
.hero{padding-block:36px 8px;display:grid;gap:18px}
.eyebrow{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.hero h1{font:800 clamp(44px,9vw,104px)/.92 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 .ar{color:var(--accent)}
.hero .jpline{font-size:clamp(18px,3vw,26px);color:var(--muted);letter-spacing:.2em;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:4px}
.stat b{display:block;font:800 clamp(24px,4vw,34px)/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.cd b{color:var(--gold)}
.maps{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:10px}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.mapbox h2{position:absolute;left:16px;top:12px;margin:0;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);z-index:1}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:none}
.grat{fill:none;stroke:var(--grid);stroke-width:.6}
.leg{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.leg.back{stroke:var(--blue);stroke-dasharray:5 5;opacity:.85}
.leg.day{stroke:var(--gold);stroke-dasharray:3 4}
.draw{animation:draw 2.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mk{cursor:pointer}
.mk .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.mk.hub .dot{fill:var(--muted)}
.mk.hub{cursor:default}
.mk .pulse{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.mk .lab{font:700 13px var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.mk .lab2{font:500 11px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.mk .labjp{font:600 15px var(--jp);fill:var(--accent);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.mk:hover .dot,.mk:focus .dot,.mk.on .dot{fill:var(--gold)}
.mk:focus{outline:none}.mk:focus-visible .dot{stroke:var(--blue);stroke-width:3}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.maphint{font-size:13px;color:var(--muted);margin:10px 0 0}
.mapload{padding:60px 16px;text-align:center;color:var(--muted);font-size:14px}

/* cartões de cidade */
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:22px}
.cc{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;color:var(--fg);aspect-ratio:4/5;max-width:100%}
.cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.cc:hover img{transform:scale(1.05)}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,18,0) 35%,rgba(5,8,18,.88) 100%)}
.cc .ct{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff}
.cc .ct .jp{display:block;font-size:22px;color:#ffb3a4;line-height:1}
.cc .ct b{display:block;font:800 22px var(--display);letter-spacing:-.01em;margin-top:4px}
.cc .ct span{font-size:12.5px;color:#cfd5e6}
.cc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* painel da cidade */
.panel{margin-top:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;scroll-margin-top:90px}
.ph{position:relative;min-height:260px;display:flex;align-items:flex-end;padding:22px;background:var(--surface-2)}
.ph img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,18,.15),rgba(5,8,18,.9))}
.ph .pt{position:relative;z-index:1;color:#fff;display:grid;gap:4px;min-width:0}
.ph .pt .jp{font-size:clamp(26px,5vw,44px);color:#ffb3a4;line-height:1}
.ph .pt h2{font:800 clamp(34px,7vw,64px)/.95 var(--display);margin:0;letter-spacing:-.03em}
.ph .pt p{margin:0;color:#d6dbea;font-size:14px}
.ph .x{position:absolute;right:14px;top:14px;z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:14px;padding:8px 14px;cursor:pointer}
.pb{padding:18px 20px 22px;display:grid;gap:16px}
.daybtns{display:flex;flex-wrap:wrap;gap:8px}
.daybtn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer}
.daybtn small{font-weight:500;color:var(--muted);margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mos{columns:4 170px;column-gap:10px}
.mi{break-inside:avoid;margin:0 0 10px;position:relative;border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:zoom-in;display:block;width:100%;border:0;padding:0}
.mi img{display:block;width:100%;height:auto}
.mi .tg{position:absolute;left:6px;top:6px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff}
.mi.must .tg{background:var(--accent);color:var(--accent-fg)}
.mi.mine .tg{background:var(--blue);color:#0b1020}
.mi.done img{filter:grayscale(.8) brightness(.65)}
.mi.done .tg::after{content:" · feita"}
.mi .lc{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11.5px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));text-align:left}

/* dia */
.dayhead{position:relative;margin-top:18px;border-radius:18px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:var(--surface-2);border:1px solid var(--line)}
.dayhead img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.dayhead img.cover.in{opacity:1}
.dayhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,18,.05) 0%,rgba(5,8,18,.55) 55%,rgba(5,8,18,.94) 100%)}
.dh{position:relative;z-index:1;padding:22px;width:100%;display:grid;gap:12px;color:#fff}
.dh .k{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#ffb3a4;margin:0}
.dh h1{font:800 clamp(34px,7vw,66px)/.95 var(--display);letter-spacing:-.03em;margin:0;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.dh h1 .jp{font-size:.55em;color:#ffb3a4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--body);padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums;white-space:nowrap}
a.chip:hover{background:rgba(255,255,255,.2)}
.chip.sun{color:#ffd99a}
.chip.next{background:var(--accent);border-color:var(--accent)}
.prog{display:flex;gap:12px;align-items:center;font-size:13px;color:#d6dbea}
.meter{flex:1;max-width:260px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.routine{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rt h3{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.rt h3 span{font-variant-numeric:tabular-nums}
.rt label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.rt input{width:18px;height:18px;accent-color:var(--ok);flex:none;margin-top:1px}
.rt label.on{color:var(--muted);text-decoration:line-through}
.timeline{position:relative;margin-top:8px;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:28px;bottom:20px;width:2px;background:var(--line)}
.loc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:96px}
.loc::before{content:"";position:absolute;left:-22px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.loc.complete::before{background:var(--ok);border-color:var(--ok)}
.loc.quiet::before{border-color:var(--line)}
.loc.quiet{padding:12px 16px;gap:6px}
.lt{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.time{font:700 14px var(--body);color:var(--gold);font-variant-numeric:tabular-nums;min-width:3.6em}
.loc h2{font:700 20px var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.lp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lp.done{color:var(--ok);font-weight:700}
.note{background:var(--note);color:var(--note-fg);border-radius:9px;padding:9px 12px;font-size:14px;margin:0}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.lk a{font:600 13px var(--body);color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.lk a:hover{border-color:var(--blue)}
.lbl{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.lbl.m{color:var(--accent)}.lbl.y{color:var(--blue)}
.must{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.shot{position:relative;margin:0;border-radius:10px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/4;max-width:100%}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.shot.done img{filter:grayscale(.85) brightness(.6)}
.chk{position:absolute;left:0;right:0;bottom:0;border:0;font:700 14px var(--body);padding:12px 8px;background:rgba(5,8,18,.72);color:#fff;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.chk .box{width:18px;height:18px;border:2px solid #fff;border-radius:4px;display:grid;place-items:center;font-size:13px;line-height:1}
.shot.done .chk{background:var(--ok);color:var(--ok-fg)}
.shot.done .chk .box{border-color:var(--ok-fg)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.strip button{flex:none;border:0;padding:0;background:var(--surface-2);border-radius:8px;overflow:hidden;cursor:zoom-in}
.strip img{height:130px;width:auto;display:block}
.strip.mine img{height:150px}
.strip.mine button{outline:2px solid var(--blue);outline-offset:-2px}
.empty-t{color:var(--muted);font-size:14px;margin:0}

/* equipamentos */
.sech{padding-block:30px 6px}
.sech h1{font:800 clamp(34px,6vw,58px)/.95 var(--display);letter-spacing:-.03em;margin:0}
.sech p{color:var(--muted);margin:8px 0 0;max-width:64ch}
.gtop{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:800 22px var(--display);fill:var(--fg)}
.gsum{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:500 13px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--fg)}
.pill.warn{border-color:var(--accent);color:var(--accent)}.pill.warn b{color:var(--accent)}
.buy{margin-top:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:12px 16px}
.buy h3{margin:0 0 6px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.buy ul{margin:0;padding-left:18px}.buy li{padding:2px 0}
.gcat{margin-top:22px}
.gcat h2{font:700 18px var(--display);margin:0 0 8px}
.gl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.gi{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.gi:first-child{border-top:0}
.gi.nao{opacity:.5}
.gi.packed .gn{text-decoration:line-through;color:var(--muted)}
.gn{min-width:0;font-size:15px}
.gn small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pk{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:transparent;color:var(--ok-fg);cursor:pointer;font:700 15px var(--body);display:grid;place-items:center}
.gi.packed .pk{background:var(--ok);border-color:var(--ok)}
.st{font:500 12.5px var(--body);border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface-2);color:var(--fg);max-width:124px}
.st[data-v="temos"]{border-color:var(--ok);color:var(--ok)}
.st[data-v="comprar"],.st[data-v="alugar"]{border-color:var(--accent);color:var(--accent)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px;line-height:1}
.addf{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:20px;padding:14px;border:1px dashed var(--line);border-radius:14px}
.addf input,.addf select{font:15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.addf button{font:600 14px var(--body);border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:var(--accent-fg);cursor:pointer}

/* vídeos */
.xsec{margin-top:26px}
.xsec h2{font:700 20px var(--display);margin:0 0 4px}
.xsec>p{color:var(--muted);font-size:14px;margin:0 0 12px}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.reel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.reel.fav{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.rc{position:relative;aspect-ratio:16/11;background:var(--surface-2);max-width:100%}
.rc img{width:100%;height:100%;object-fit:cover;display:block}
.rc .fv{position:absolute;left:8px;top:8px;font:700 11px var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--gold);color:#1a1205;padding:4px 7px;border-radius:4px}
.rc .play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;text-decoration:none}
.rb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rb .q{font-size:14.5px;font-weight:600;margin:0}
.rb .a{font-size:13.5px;color:var(--muted);margin:0}
.rb .m{font-size:12.5px;color:var(--muted);margin:0}
.rb a.go{font:600 13.5px var(--body);color:var(--blue);text-decoration:none;margin-top:2px}
.xf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.xf figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.xf button{border:0;padding:0;display:block;width:100%;cursor:zoom-in;background:none}
.xf img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.xf figcaption{font-size:13px;color:var(--muted);padding:8px 10px}

/* offline */
.off{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.off p{margin:0;font-size:14px;color:var(--muted);flex:1;min-width:220px}

async function idbGet(k){const d=await idb();if(!d)return null;return new Promise(res=>{try{const q=d.transaction("f").objectStore("f").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}

function load(f){
  if(DATA[f])return Promise.resolve(DATA[f]);
  if(!LOADING[f])LOADING[f]=fetch(f).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{idbPut(f,j);return DATA[f]=j}).catch(async()=>{const j=await idbGet(f);if(j)return DATA[f]=j;LOADING[f]=null;throw 0});
  return LOADING[f];
}

      row.append(pk,nm,st,del);ul.appendChild(row)});
    sec.appendChild(ul);main.appendChild(sec)});
  const f=el("form","addf");f.innerHTML='<input id="g-name" placeholder="Novo item (ex: lente 50mm)" aria-label="Nome do item" required><select id="g-cat" aria-label="Categoria"></select><button type="submit">Adicionar</button>';
  CATS.forEach(c=>f.querySelector("#g-cat").appendChild(el("option",null,c)));
  f.onsubmit=e=>{e.preventDefault();const n=f.querySelector("#g-name").value.trim();if(!n)return;const id="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);saveGear(id,{cat:f.querySelector("#g-cat").value,name:n,qty:1,status:"confirmar",packed:false,order:999})};
  main.appendChild(f);
}
function strip(g){const{id,...r}=g;return r}
async function saveGear(id,data){const prev=gear[id];if(data)gear[id]=data;else delete gear[id];render();tabs();if(!await writeDoc("gear",id,data)){if(prev)gear[id]=prev;else delete gear[id];render();tabs()}}

function renderVideos(main){
  const hd=el("section","sech");hd.append(el("p","eyebrow","Referências de vídeo"),el("h1",null,"Vídeos e extras"),el("p",null,"Os reels que vocês salvaram, separados pelo uso. A favorita da intro está em destaque. No fim, as fotos das pastas que não caíram em nenhum local do roteiro."));main.appendChild(hd);
  const box=el("div");box.appendChild(el("p","empty-t","Carregando…"));main.appendChild(box);
  load("ck-extras.json").catch(()=>({})).then(d=>{
    if(tab!=="Vídeos")return;box.innerHTML="";
    Object.keys(CATN).forEach(c=>{
      const list=REELS.filter(r=>r.cat===c).sort((a,b)=>b.fav-a.fav);if(!list.length)return;
      const sec=el("section","xsec");sec.appendChild(el("h2",null,CATN[c]+" · "+list.length));const g=el("div","reels");
      list.forEach(r=>{
        const card=el("article","reel"+(r.fav?" fav":""));const cv=el("div","rc");
        if(d[r.id]){const im=el("img");im.src=d[r.id];im.alt="Frame do reel de "+(r.autor||"referência");im.loading="lazy";cv.appendChild(im)}
        if(r.fav)cv.appendChild(el("span","fv","Favorita da intro"));
        const pl=el("a","play","▶");pl.href=r.url;pl.target="_blank";pl.rel="noopener";pl.setAttribute("aria-label","Abrir no Instagram");cv.appendChild(pl);
        const b=el("div","rb");b.appendChild(el("p","q",r.nota||"Ref salva na coleção"));if(r.aproveitar)b.appendChild(el("p","a",r.aproveitar));
        const meta=[r.autor,r.musica?"♪ "+r.musica:"",r.dur?Math.round(r.dur)+"s":""].filter(Boolean).join(" · ");if(meta)b.appendChild(el("p","m",meta));
        const a=el("a","go","Abrir no Instagram ↗");a.href=r.url;a.target="_blank";a.rel="noopener";b.appendChild(a);
        card.append(cv,b);g.appendChild(card)});
      sec.appendChild(g);box.appendChild(sec)});
    if(EXTRA.length){const sec=el("section","xsec");sec.append(el("h2",null,"Fotos fora do roteiro"),el("p",null,"Esses lugares não estão no roteiro. Se quiserem encaixar algum, é só avisar."));
      const g=el("div","xf");const list=EXTRA.filter(x=>d[x.id]).map(x=>({src:d[x.id],id:x.id,cap:x.desc}));
      list.forEach((x,i)=>{const f=el("figure");const bt=el("button");const im=el("img");im.src=x.src;im.alt=x.cap;im.loading="lazy";bt.appendChild(im);bt.onclick=()=>openLB(list,i);f.append(bt,el("figcaption",null,x.cap));g.appendChild(f)});
      sec.appendChild(g);box.appendChild(sec)}
  });
}

(async()=>{
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  const sy=$("#sync");
  if(!db){local=true;try{done=JSON.parse(localStorage.getItem("ck-done")||"{}");gear=JSON.parse(localStorage.getItem("ck-gear")||"{}");rout=JSON.parse(localStorage.getItem("ck-routine")||"{}")}catch(e){};sy.textContent="Salvando só neste aparelho";sy.classList.add("warn");tabs();render();return}
  sy.textContent="Sincronizado";
  db.collection("done").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{n[d.id]=d.data()});const ch=new Set([...Object.keys(n),...Object.keys(done)]);done=n;ch.forEach(paint);tabs()},()=>{sy.textContent="Sem conexão. Recarregue.";sy.classList.add("warn")});
  db.collection("gear").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{n[d.id]=d.data()});gear=n;tabs();if(tab==="Equipamentos"&&!document.activeElement?.closest?.(".addf"))render()},()=>{});
  db.collection("routine").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{n[d.id]=d.data()});rout=n;refreshRoutine()},()=>{});
})();
